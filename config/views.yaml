robot_ip: 192.168.1.10

# Hand-eye calibration result
hand_eye:
  parent: end_effector_link
  child: camera_link
  translation: [-0.371, 0.008, 0.223]            # x, y, z (m)
  rotation: [0.709, 0.705, -0.013, -0.001]  # qx, qy, qz, qw



cloud_axes: gz_body
# cloud_axes: optical
base_frame: base_link
ee_link: end_effector_link
cloud_topic: /camera/camera/depth/color/points
settle_time: 2.0          
frames_per_view: 5        
speed: 0.5                
motion: cartesian         
cartesian_fallback: false 
view_voxel: 0.0005         
max_depth: 0.40           

workspace:
  x: [-0.8, 0.80]
  y: [-0.80, 0.80]
  z: [-0.30, 0.40]


# Home: 
home: [0.329, -0.017, 0.391, 1.000, -0.017, -0.012, -0.011]  # [x, y, z, qx, qy, qz, qw]  


# Number of viewpoint perturbations (including initial position)
num_views: 5

# Maximum translational perturbation per axis, in meters.
# Each step samples independently from [-magnitude, +magnitude].
perturbation:
  x: 0.04
  y: 0.04
  z: 0.02

angular_perturbation:   # degrees, sampled uniformly in [-v, +v]
  roll: 2.0
  pitch: 2.0
  yaw: 2.0


